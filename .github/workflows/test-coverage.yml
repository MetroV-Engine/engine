name: Test and coverage

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  test-coverage:
    name: Run tests and check coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@v4.3.1
        with:
          cmakeVersion: 3.31.6
          ninjaVersion: 1.12.1

      - name: Install SDL3 build dependencies (Ubuntu)
        if: runner.os == 'Linux'
        # Fail fast on a mirror/DNS outage instead of retrying for 20 minutes.
        timeout-minutes: 8
        env:
          APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y zip unzip pkg-config autoconf autoconf-archive automake libtool libltdl-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev \
            wayland-protocols libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev \
            libudev-dev

      - name: Install gcovr
        run: python -m pip install gcovr

      - name: Run tests and check coverage
        run: python project_scripts/test_coverage.py --minimum 90

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-coverage-report
          path: build/coverage/report/index.html