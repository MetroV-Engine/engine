name: Test and coverage

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  test-coverage:
    name: Run tests and check coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@v4.3.1
        with:
          cmakeVersion: 3.31.6
          ninjaVersion: 1.12.1

      - name: Install vcpkg bootstrap dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip

      - name: Install gcovr
        run: python -m pip install gcovr

      - name: Run tests and check coverage
        run: python project_scripts/test_coverage.py --minimum 90

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-coverage-report
          path: build/tests/coverage/index.html