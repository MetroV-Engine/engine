# Compiles and tests the bgfx backend (ENGINE_RENDERER_BGFX=ON) on the three OSes. Not run on PRs: the first
# build fetches bgfx and builds its shader compiler, which is slow. Start it by hand from the Actions tab, or
# push to the disposable branch bgfx-check (the button only shows once this file is on the default branch).
name: bgfx compile check

on:
  workflow_dispatch:
  push:
    branches: [bgfx-check]

jobs:
  compile:
    name: Compile with bgfx on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@v4.3.1
        with:
          cmakeVersion: 3.31.6
          ninjaVersion: 1.12.1

      - name: Create vcpkg cache directory
        shell: bash
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Init vcpkg submodule
        run: git submodule update --init --depth 1 vcpkg

      - name: Install SDL3 build dependencies (Ubuntu)
        if: runner.os == 'Linux'
        # Fail fast on a mirror/DNS outage instead of retrying for 20 minutes.
        timeout-minutes: 8
        env:
          APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y zip unzip pkg-config autoconf autoconf-archive automake libtool libltdl-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev \
            wayland-protocols libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev \
            libudev-dev

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', '.github/workflows/bgfx-compile.yml') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      # vcpkg builds its libraries with MSVC (x64-windows triplet). Without
      # this, Ninja picks MinGW g++ from the runner's PATH, which cannot link
      # MSVC C++ libraries (ImGui: "undefined reference to ImGui::...").
      - name: Select MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile everything with bgfx (executables, editor, tests, shaders)
        run: python project_scripts/build.py --preset bgfx-tests

      - name: Run all tests (bgfx runs its Noop device, headless)
        run: ctest --preset bgfx-tests
