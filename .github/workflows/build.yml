name: Build and test

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  compile:
    name: Compile on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@v4.3.1
        with:
          cmakeVersion: 3.31.6
          ninjaVersion: 1.12.1

      - name: Install vcpkg bootstrap deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            vcpkg_installed
            vcpkg/buildtrees
            vcpkg/packages
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Compile project and tests
        run: python project_scripts/build.py --tests --no-test-run

      - name: Upload Linux test binary
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-binary
          path: build/tests/tests_ecs

  test-linux:
    name: Run Linux unit tests
    runs-on: ubuntu-latest
    needs: compile

    steps:
      - name: Download Linux test binary
        uses: actions/download-artifact@v4
        with:
          name: linux-test-binary
          path: build/tests

      - name: Make test binary executable
        run: chmod +x build/tests/tests_ecs

      - name: Run unit tests
        run: ./build/tests/tests_ecs

  coverage-linux:
    name: Generate Linux coverage
    runs-on: ubuntu-latest
    needs: compile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@v4.3.1
        with:
          cmakeVersion: 3.31.6
          ninjaVersion: 1.12.1

      - name: Install gcovr
        run: python -m pip install gcovr

      - name: Build and generate coverage
        run: python project_scripts/build.py --tests --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: linux-coverage-report
          path: build/tests/coverage/index.html
