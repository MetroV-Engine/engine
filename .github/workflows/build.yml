name: Build with Ninja

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Init vcpkg submodule
        run: git submodule update --init --depth 1 vcpkg

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@v4.3.1
        with:
          cmakeVersion: 3.31.6
          ninjaVersion: 1.12.1

      - name: Install vcpkg bootstrap deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip

      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: vcpkg/installed
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Configure CMake
        run: cmake -B cmake-build-debug -G Ninja

      - name: Build with Ninja
        run: ninja -C cmake-build-debug
